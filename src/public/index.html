<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <p>Hello, Welcome to the Expense Tracker app!</p>

        <button id="logout-button">Logout</button>

        <form id="expense-form">
         <label for="category">Category:</label>
         <input type="text" id="category" placeholder="e.g. Food, Transport, Data, etc" required>
         <label for="amount">Amount:</label>
         <input type="number" id="amount" placeholder="Amount" required>
         <label for="description">Description:</label>
         <input type="text" id="description" placeholder="e.g. breakfast, lunch, outings, etc" required>
         <label for="date">Date:</label>
         <input type="date" id="date" required>
         <button type="submit">Add Expense</button>
        </form>

        <div class="summary">
            <div class="summary-card">
               <h2>Total Expenses:</h2>
               <p id="total-expenses">₦0.00</p>
            </div>
            <div class="summary-card">
                <h2>Expense Count:</h2>
                <p id="expense-count">0</p>
            </div>
        </div>
     

        <div class="add-expense">
            <h2>Add Expense:</h2>
            <p>Record a new expense:</p>
            <button id="add-expense-button">Add Expense</button>
        </div>

        <div class="expense-list">
                <h2>Recent Expenses:</h2>
            <div class="expense-controls">
                <input type="text" id="search" placeholder="Search by category">
                <button id="search-button">Search</button>
            
            <select id="sort">
                <option value="newest">Sort by Newest</option>
                <option value="oldest">Sort by Oldest</option>
                <option value="highest">Sort by Highest Amount</option>
                <option value="lowest">Sort by Lowest Amount</option>
            </select>

            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Data">Data</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Religion">Religion</option>
                <option value="Airtime">Airtime</option>
                <option value="others">others</option>
            </select>
            </div>
            <ul id="expense-list"></ul>
            <button id="view-all">view all</button>
        </div>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
